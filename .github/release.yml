# Groups the list of merged pull requests GitHub generates as the release notes
# for the drafts publish.yml creates.
#
# Read once, when a draft is created, so a label added afterwards regroups nothing.
# A pull request lands in the first category whose labels match, which is what
# lets `breaking-change` win over any other label, and why '*' stays last -- quoted,
# since a bare * is a YAML alias.
changelog:
  exclude:
    labels:
      - skip-release-notes
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - enhancement
    - title: Improvements
      labels:
        - improvement
    - title: Bug fixes
      labels:
        - bug
    - title: Other changes
      labels:
        - '*'
