name: deploy

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# A branch only ever needs its newest commit deployed.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: pages (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `project` is the Pages project name, as listed in Cloudflare's
          # Workers & Pages dashboard -- not the custom domain.
          - name: apidoc
            project: mobx-sentinel-apidoc
            build: pnpm doc
            output: docs
          - name: example
            project: mobx-sentinel-example
            build: pnpm --filter example build
            output: apps/example/dist
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          # The Pages build pinned NODE_VERSION=20.14.0, but wrangler requires
          # >=22 and Node 20 is EOL, so both builds move up. The version now
          # lives in .node-version, shared with the other workflows.
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Both artifacts are built off the packages' dist, so build them first.
      - run: pnpm build
      - run: ${{ matrix.build }}

      # Cloudflare decides production vs. preview by comparing `--branch`
      # against the project's production branch.
      #
      # wrangler is invoked directly rather than through cloudflare/wrangler-action,
      # which installs it with `pnpm add` -- something pnpm refuses to do at the
      # root of a workspace.
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
          PROJECT: ${{ matrix.project }}
          OUTPUT: ${{ matrix.output }}
        run: |
          pnpm dlx wrangler@4 pages deploy "$OUTPUT" \
            --project-name="$PROJECT" \
            --branch="$GITHUB_REF_NAME"
          jq -r 'select(.type == "pages-deploy-detailed")
                 | "url=\(.alias // .url)", "environment=\(.environment)"' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"

      # Surface the URL on the commit and on any PR the branch belongs to,
      # the way the Git integration used to.
      - name: Report
        if: steps.deploy.outputs.url != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          NAME: ${{ matrix.name }}
          ENVIRONMENT: ${{ steps.deploy.outputs.environment }}
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { NAME, ENVIRONMENT, URL } = process.env;
            const production = ENVIRONMENT === 'production';

            await core.summary
              .addHeading(`${NAME} (${ENVIRONMENT})`, 3)
              .addLink(URL, URL)
              .write();

            const { data: deployment } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.sha,
              environment: `${NAME} (${ENVIRONMENT})`,
              description: 'Cloudflare Pages',
              production_environment: production,
              transient_environment: !production,
              auto_merge: false,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: URL,
              description: 'Cloudflare Pages',
            });
