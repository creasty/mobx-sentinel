name: publish

on:
  workflow_dispatch:
    inputs:
      bump_version:
        description: 'X.Y.Z to release. Leave empty to publish the current version as-is.'
        required: false
        type: string
  # Publishing the draft release that `bump` left behind is what ships to npm,
  # rather than the bump landing on main. Nothing forces that -- the bump is
  # merged by hand, so main's push fires normally -- it is so the notes get
  # written before the version exists on npm, and so `main` has been through its
  # own test and deploy run by the time anything ships.
  release:
    types: [published]

jobs:
  # Cut the bump PR and leave the release notes waiting as a draft. Publishes
  # nothing on purpose: what ships is what sits on main after review, not what
  # this job happened to compute.
  bump:
    if: github.event_name == 'workflow_dispatch' && inputs.bump_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump branch, create the draft release
      pull-requests: write # open the PR and link the draft on it
      actions: write # dispatch push.yml on the bump branch
    # Two bumps in flight would race for the same branch and draft.
    concurrency:
      group: publish-bump
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check the version is releasable
        id: check
        env:
          VERSION: ${{ inputs.bump_version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "not a plain X.Y.Z version: $VERSION" >&2
            exit 1
          fi

          # The branch is cut from whatever was dispatched, and the draft release
          # targets main. Dispatched anywhere else, the bump PR would carry that
          # branch's commits into main along with the version.
          if [ "$GITHUB_REF_NAME" != 'main' ]; then
            echo "a bump releases from main; this was dispatched on $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if [ "$VERSION" = "$(./script/version)" ]; then
            echo "already at $VERSION -- dispatch with an empty bump_version to publish it as-is" >&2
            exit 1
          fi

          BRANCH="bump-version-${VERSION//./-}"

          for ref in "refs/heads/$BRANCH" "refs/tags/v$VERSION"; do
            if git ls-remote --exit-code origin "$ref" >/dev/null 2>&1; then
              echo "$ref already exists -- pick another version, or clean up what is there" >&2
              exit 1
            fi
          done

          # Compare output, not exit status: `npm view` reports a missing version
          # as a non-zero exit on some npm releases and as zero with no output on
          # others.
          if [ -n "$(npm view "@mobx-sentinel/core@$VERSION" version 2>/dev/null || true)" ]; then
            echo "@mobx-sentinel/core@$VERSION is already on npm" >&2
            exit 1
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Bump and push
        env:
          VERSION: ${{ inputs.bump_version }}
          BRANCH: ${{ steps.check.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./script/bump "$VERSION"
          # Authorship is cosmetic -- only the token that performs the push
          # decides whether events fire, and GITHUB_TOKEN's never do.
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --all --message "Bump version $VERSION" --message "$RUN_URL"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Open the PR and draft the release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.bump_version }}
          BRANCH: ${{ steps.check.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { VERSION, BRANCH, RUN_URL } = process.env;
            const tag = `v${VERSION}`;

            const { data: pr } = await github.rest.pulls.create({
              ...context.repo,
              title: `Bump version ${VERSION}`,
              head: BRANCH,
              base: 'main',
              body: [
                '## Why',
                '',
                `Release ${VERSION}. Opened by [publish](${RUN_URL}).`,
                '',
                '## What',
                '',
                '`version` in the three `packages/*/package.json`, and nothing else --',
                '`script/bump` touches no other file, and the `workspace:~` specifiers carry no',
                'version, so `pnpm-lock.yaml` is unchanged.',
                '',
                `Merging this does not publish anything. The ${tag} release notes are waiting as a`,
                'draft; publishing that release is what ships to npm and creates the tag.',
              ].join('\n'),
            });

            // `body` is pre-pended to the generated notes, so the prose skeleton lands
            // above `## What's Changed` -- the shape every release here already has.
            //
            // Drafted before the merge, which is deliberate: notes generated now cover
            // the previous tag through main as it stands, which is what keeps
            // "Bump version X.Y.Z" out of the changelog. Releasing promptly after the
            // bump lands keeps them accurate.
            //
            // Create-if-absent, because GitHub happily keeps two drafts with the same
            // tag_name and a re-run would leave you choosing between them.
            const { data: releases } = await github.rest.repos.listReleases({ ...context.repo, per_page: 100 });
            let release = releases.find((r) => r.tag_name === tag);
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                name: tag,
                // The tag does not exist yet; publishing the draft creates it here.
                target_commitish: 'main',
                draft: true,
                body: [
                  `> Do not publish until #${pr.number} has merged: publishing this release is`,
                  `> what ships ${VERSION} to npm, and it tags whatever main says at that moment.`,
                  '',
                  '## Fixed',
                  '',
                  '-',
                  '',
                  '## Changed',
                  '',
                  '-',
                  '',
                ].join('\n'),
                generate_release_notes: true,
              }));
            }

            await github.rest.pulls.update({
              ...context.repo,
              pull_number: pr.number,
              body: `${pr.body}\n\nDraft release: ${release.html_url}`,
            });

            // The PR raised no `pull_request` event, so nothing would report `test-ok`
            // and a required check that never reports leaves Merge greyed out for
            // good. See push.yml's trigger comment.
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'push.yml',
              ref: BRANCH,
            });

            // Auto-merge is deliberately not enabled. GITHUB_TOKEN can turn it on, but
            // the merge it then performs is attributed to github-actions[bot] and so
            // starts nothing: main would get no test run and no Pages deploy, and the
            // release would ship a commit main's own CI never saw. Merged by hand it
            // all happens in the right order, and the cost is one click -- so this
            // summary is the handoff.
            await core.summary
              .addHeading(`Bump version ${VERSION}`, 3)
              .addList(
                [
                  `<a href="${pr.html_url}">${pr.html_url}</a> -- merge it once <code>test-ok</code> reports (just dispatched, give it a moment to appear)`,
                  `<a href="${release.html_url}">draft ${tag}</a> -- then write the notes and publish it, which is what ships ${VERSION} to npm`,
                ],
                true,
              )
              .write();

  # What to publish, settled before anything is built. npm is the authority on
  # "has this shipped": it is the part that cannot be undone, and it stays true
  # even if a tag went missing.
  check:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && inputs.bump_version == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
      version: ${{ steps.guard.outputs.version }}
      tag: ${{ steps.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: guard
        env:
          # Empty on the dispatch path.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Asserts the three packages agree and that the version is a plain
          # X.Y.Z, which is also what keeps a `-dev-` tree away from `latest`.
          VERSION="$(./script/version)"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # The tag says 0.3.6, so the tree had better. This catches the one sharp
          # edge of publishing on `release`: publish the draft before the bump PR
          # merges and GitHub tags a main that still says 0.3.5.
          if [ -n "$RELEASE_TAG" ] && [ "$TAG" != "$RELEASE_TAG" ]; then
            echo "$RELEASE_TAG is tagged at a tree that says $VERSION." >&2
            echo "Merge the bump PR, delete the tag and the release, then dispatch" >&2
            echo "publish with an empty bump_version." >&2
            exit 1
          fi

          if [ -n "$(npm view "@mobx-sentinel/core@$VERSION" version 2>/dev/null || true)" ]; then
            echo "@mobx-sentinel/core@$VERSION is already on npm; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tag without the matching npm version means an earlier publish stopped
          # half way. Refuse rather than guess. Skipped on the release path, where
          # the tag was created by publishing the release and proves nothing.
          if [ -z "$RELEASE_TAG" ] && git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG exists but @mobx-sentinel/core@$VERSION is not on npm:" >&2
            echo "an earlier publish stopped half way. Look before retrying." >&2
            exit 1
          fi

          echo 'publish=true' >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and draft the release on the dispatch path
      id-token: write # npm trusted publishing
    # Never cancelled: stopping `pnpm publish` between core and react leaves a
    # version half published, and npm lets nobody re-cut one.
    concurrency:
      group: publish-npm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@12.0.2
      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      # The maintainer's "is main green?" glance used to be the gate and this
      # workflow no longer waits for it. On the release path it is the only test
      # run there is: the merge that landed the bump raised no push event, so
      # main's own run has not happened yet.
      - run: pnpm test

      - name: Publish packages
        run: pnpm publish --tag latest --recursive --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Tag and draft the release
        # Dispatch path only. After the upload, not before: a tag created first
        # would stand in the way of retrying a publish that failed.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.check.outputs.tag }}
        with:
          script: |
            const { TAG } = process.env;

            try {
              await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${TAG}`, sha: context.sha });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 is "already exists", which is fine
            }

            const { data: releases } = await github.rest.repos.listReleases({ ...context.repo, per_page: 100 });
            if (!releases.some((r) => r.tag_name === TAG)) {
              // Notes generated here do include the bump PR, since it has merged by now.
              await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: TAG,
                name: TAG,
                draft: true,
                body: '## Fixed\n\n-\n\n## Changed\n\n-\n',
                generate_release_notes: true,
              });
            }

      - name: Report
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          {
            echo "### Published $VERSION"
            echo
            echo '```'
            echo "pnpm add @mobx-sentinel/core@$VERSION @mobx-sentinel/form@$VERSION @mobx-sentinel/react@$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
