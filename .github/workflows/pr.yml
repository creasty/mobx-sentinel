name: pr

on:
  pull_request:

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Run reviewdog
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: format
      # After reviewdog, so its suggestions still land when this fails. The GritQL
      # plugins in script/biome name nodes of Biome's syntax tree; if a Biome upgrade
      # stops one from matching, the only symptom is an unused suppression in the
      # fixtures, which is a warning that `pnpm format` above does not fail on.
      - run: pnpm lint:plugins
